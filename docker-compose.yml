version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16  # Специальный образ Postgres с уже установленным pgvector
    environment:
      POSTGRES_USER: tracker_user
      POSTGRES_PASSWORD: tracker_password
      POSTGRES_DB: news_tracker_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=db
      - DB_NAME=news_tracker_db
      - DB_USER=tracker_user
      - DB_PASSWORD=tracker_password
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis

  celery:
    build: .
    command: celery -A core worker -l info  # "core" - это будет название главной папки Django
    volumes:
      - .:/app
    environment:
      - DB_HOST=db
      - DB_NAME=news_tracker_db
      - DB_USER=tracker_user
      - DB_PASSWORD=tracker_password
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis
      - web

volumes:
  postgres_data: