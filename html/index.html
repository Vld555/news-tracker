<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News Tracker - Главная</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans antialiased">
    <div id="app">
        <nav class="bg-white shadow-sm border-b border-gray-200">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex justify-between h-16">
                    <div class="flex items-center">
                        <span class="text-2xl font-black text-indigo-600 tracking-tight">NewsTracker</span>
                    </div>
                    <div class="flex items-center space-x-6">
                        <div class="text-gray-400 cursor-not-allowed flex items-center space-x-1" title="Доступно после авторизации">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
                            <span class="text-sm font-medium">Статистика</span>
                        </div>
                        <button class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2.5 rounded-lg text-sm font-semibold transition-colors duration-200">
                            Войти
                        </button>
                    </div>
                </div>
            </div>
        </nav>

        <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
            <div class="flex justify-between items-end mb-8">
                <div>
                    <h1 class="text-3xl font-bold text-gray-900">Свежие статьи</h1>
                    <p class="text-gray-500 mt-2">Общая лента новостей. Войдите, чтобы включить умные рекомендации.</p>
                </div>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                <div v-for="article in articles" :key="article.id" class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden flex flex-col hover:shadow-md transition-shadow duration-200">
                    <div class="p-6 flex-1">
                        <div class="flex items-center justify-between mb-3">
                            <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-indigo-100 text-indigo-800">
                                {{ article.source_name }}
                            </span>
                            <span class="text-xs text-gray-500">{{ formatDate(article.published_at) }}</span>
                        </div>
                        <h2 class="text-xl font-bold text-gray-900 mb-3 leading-tight">{{ article.title }}</h2>
                        <p class="text-gray-600 text-sm line-clamp-3">{{ article.content }}</p>
                    </div>
                    <div class="bg-gray-50/50 px-6 py-4 border-t border-gray-100">
                        <a :href="article.url" target="_blank" class="text-indigo-600 hover:text-indigo-900 text-sm font-semibold inline-flex items-center">
                            Читать источник
                            <svg class="w-4 h-4 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                        </a>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const { createApp } = Vue

        createApp({
            data() {
                return {
                    articles: [],
                    loading: true,
                    error: null
                }
            },
            mounted() {
                // Как только страница загрузилась, стучимся в наш DRF API
                this.fetchArticles();
            },
            methods: {
                async fetchArticles() {
                    try {
                        const response = await fetch('http://localhost:8000/api/v1/articles/');
                        if (!response.ok) throw new Error('Ошибка сети');
                        
                        // Сохраняем полученные новости в нашу реактивную переменную
                        this.articles = await response.json();
                    } catch (err) {
                        this.error = "Не удалось загрузить статьи. Проверьте, запущен ли бэкенд.";
                        console.error(err);
                    } finally {
                        this.loading = false;
                    }
                },
                formatDate(dateString) {
                    const date = new Date(dateString);
                    return date.toLocaleDateString('ru-RU', { hour: '2-digit', minute: '2-digit', day: 'numeric', month: 'short' });
                }
            }
        }).mount('#app')
    </script>
</body>
</html>
