<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ article.title }} - NewsTracker</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans antialiased text-gray-800">
    {% verbatim %}
    <div id="app" class="min-h-screen flex flex-col">
        
        <header class="sticky top-0 bg-white/90 backdrop-blur-md border-b border-gray-200 z-10 shadow-sm">
            <div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 h-14 flex items-center justify-between">
                <a href="index.html" class="text-gray-500 hover:text-indigo-600 flex items-center text-sm font-medium transition-colors">
                    <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                    В ленту
                </a>
                <div class="flex items-center space-x-2 bg-indigo-50 px-3 py-1 rounded-full border border-indigo-100">
                    <div class="w-2 h-2 rounded-full bg-indigo-500 animate-pulse"></div>
                    <span class="text-xs font-mono font-bold text-indigo-700">Время чтения: {{ formattedTime }}</span>
                </div>
            </div>
        </header>

        <main v-if="article" class="flex-grow max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-10 w-full bg-white shadow-sm mt-4 mb-8 rounded-2xl border border-gray-100">
            <div class="flex items-center space-x-3 mb-6">
                <span class="px-2.5 py-1 rounded-md text-xs font-bold bg-gray-100 text-gray-700 uppercase tracking-wider">
                    {{ article.category }}
                </span>
                <span class="text-sm text-gray-500">Опубликовано: {{ formatDate(article.published_at) }}</span>
            </div>

            <h1 class="text-4xl font-black text-gray-900 mb-8 leading-tight">
                {{ article.title }}
            </h1>

            <div class="prose max-w-none text-lg leading-relaxed text-gray-700 space-y-6 mb-12" style="white-space: pre-wrap;">
                {{ article.content }}
            </div>
            
            <div class="border-t border-gray-100 pt-8 flex flex-col items-center">
                <h3 class="text-sm font-semibold text-gray-500 mb-4 uppercase tracking-wide">Помогите настроить вашу ленту</h3>
                <div class="flex space-x-4">
                    <button @click="submitFeedback('like')" class="flex items-center px-6 py-3 rounded-xl border transition-colors font-medium bg-white text-gray-600 border-gray-200 hover:bg-gray-50">Больше такого</button>
                    <button @click="submitFeedback('dislike')" class="flex items-center px-6 py-3 rounded-xl border transition-colors font-medium bg-white text-gray-600 border-gray-200 hover:bg-gray-50">Меньше такого</button>
                </div>
            </div>
        </main>
    </div>
    {% endverbatim %}

    <script>
        const { createApp } = Vue

        createApp({
            data() {
                return {
                    article: { title: 'Загрузка...', content: '' },
                    readingSeconds: 0,
                    timerInterval: null
                }
            },
            computed: {
                formattedTime() {
                    const m = Math.floor(this.readingSeconds / 60).toString().padStart(2, '0');
                    const s = (this.readingSeconds % 60).toString().padStart(2, '0');
                    return `${m}:${s}`;
                }
            },
            methods: {
                async fetchArticle() {
                    const urlParams = new URLSearchParams(window.location.search);
                    const id = urlParams.get('id');
                    if (!id) return;

                    try {
                        const response = await fetch(`http://localhost:8000/api/v1/articles/${id}/`);
                        this.article = await response.json();
                    } catch (error) {
                        console.error('Ошибка при загрузке статьи:', error);
                        this.article = { title: 'Ошибка загрузки', content: 'Не удалось загрузить статью.' };
                    }
                },
                formatDate(dateString) {
                    if (!dateString) return '';
                    return new Date(dateString).toLocaleString('ru-RU');
                },
                async sendHeartbeat() {
                    const token = localStorage.getItem('access_token');
                    const urlParams = new URLSearchParams(window.location.search);
                    const id = urlParams.get('id');

                    if (!token || !id) return;

                    try {
                        const response = await fetch(`http://localhost:8000/api/v1/articles/${id}/heartbeat/`, {
                            method: 'POST',
                            headers: {
                                'Authorization': `Bearer ${token}`,
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({
                                "duration_seconds": 15 
                            })
                        });

                        if (response.ok) {
                            const data = await response.json();
                            console.log(`[Бэкенд] Время обновлено. Всего: ${data.total_seconds} сек.`);
                        } else {
                            const errorData = await response.json();
                            console.error('Ошибка сервера:', errorData);
                        }
                    } catch (error) {
                        console.error('Ошибка сети:', error);
                    }
                }
            },
            async mounted() {
                await this.fetchArticle();

                this.timerInterval = setInterval(() => {
                    this.readingSeconds++;
                    if (this.readingSeconds % 15 === 0) this.sendHeartbeat();
                }, 1000);
            }
        }).mount('#app')
    </script>
</body>
</html>
